# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: build · typecheck · lint · test · scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test:coverage

      - name: Scan — import isolation
        run: npm run scan:isolation

      - name: Scan — SPDX headers
        run: npm run scan:spdx

      # Packs the real tarballs and installs them unhoisted, which is the one environment
      # every other gate cannot reach: inside this workspace an undeclared dependency
      # resolves anyway, and a consumer's would not.
      - name: Check — packaged artifact
        run: npm run check:packaging

  browser:
    # Parallel with `gates`, never behind it: the fast lane must stay fast, and this lane
    # exists for what a fake cannot reach — a real WebGL context, real platform APIs, and
    # (from T4.1) MapLibre's ESM worker loading, which is what breaks on a major-version
    # bump and precisely what a module mock would hide.
    name: browser · real Chromium
    runs-on: ubuntu-latest
    # Bounded on purpose: a stuck browser download or a wedged WebGL process should cost a
    # known amount of runner time rather than the platform default of six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Not cached: Playwright's own guidance is that restoring a cached browser costs
      # about what downloading it does, and a stale cache is worth less than neither.
      - name: Install Chromium
        run: npm run test:browser:install

      - name: Build
        run: npm run build

      - name: Browser tests
        run: npm run test:browser
        timeout-minutes: 10

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The PR head itself, not the synthetic merge commit actions/checkout
          # resolves by default — GitHub generates that one without a sign-off,
          # so checking it fails every PR regardless of the author's commits.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Every commit is signed off
        run: |
          missing=0
          for sha in $(git rev-list --no-merges origin/${{ github.base_ref }}..HEAD); do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>'; then
              echo "::error::commit $sha has no DCO sign-off (use git commit -s)"
              missing=1
            fi
          done
          exit $missing
