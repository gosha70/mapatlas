# SPDX-License-Identifier: Apache-2.0
#
# T8.1 — the fixture-build flake (issue #30), increment 2c.
#
# **Manual only.** `workflow_dispatch` is the sole trigger, deliberately: this exists to read a
# runner's environment, and a job that also fired on push or pull request would add CI cost to
# every change and become a source of runs nobody is reading — which is the habit issue #30 already
# warns about.
#
# **It now runs the two-arm comparison.** Positional narrowing closed at `c20b417`, so the question
# is no longer *where* the change happens but whether it depends on one property of the runtime:
# default Node against `--jitless`, alternating, **60 runs per arm**. Both arms spawn the identical
# `npm run test:coverage`; the difference travels as an environment marker that `vitest.config.ts`
# turns into the test workers' `execArgv`, so only the worker running the suite is jitless and
# Vite's parent starts normally. `npm run check:runtime-mode` — a required step of `ci.yml`, and
# part of `npm run verify` — proves that transport with real subprocesses.
#
# There is deliberately **no run-count input**: a budget chosen at dispatch time is a probabilistic
# bar selected after the result is known. 60 is the smallest equal-arm budget clearing 80% power
# against a zero-rate variant arm, and changing it means editing `scripts/flake-experiment.mjs`
# under review.
#
# It reports the environment first, keeps going after a hit so the outcome is a pair of **rates**,
# counts each arm separately with the run index of every hit, and prints the full output —
# including the placement report from PR #48 — for each. An unrelated failure or an instrument
# fault in *either* arm makes the whole experiment inconclusive, and a control arm that does not
# reproduce says nothing about the variant however the variant came out. A job that times out kills
# the run before any verdict is printed, which is what stops one being claimed.
#
# **Remove it, or record why it is kept, when T8.1 closes.** A probe left behind after the thing it
# probes is understood is a workflow nobody can explain.
name: T8.1 flake probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: 60 default + 60 --jitless runs, alternating
    runs-on: ubuntu-latest
    # Sized from measurement, not from a guess: running the real `npm run test:coverage` in both
    # modes locally gave 5 s default against 13 s jitless — a 2.6x ratio, the optimising compiler
    # being off. The last probe's runs took 14-19 s on a runner, so 60 + 60 runs is roughly
    # 60x19 + 60x50 = 69 minutes at the pessimistic end, plus a few for install and build. Double
    # that for headroom: a timeout kills the job before any verdict is printed, and an experiment
    # whose control arm was cut short is contaminated and answers nothing.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      # The same setup as the `gates` job, so the runtime read here is the runtime that has failed
      # four times rather than whatever this workflow happened to resolve.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `npm ci` because the report names the **installed** Vitest, not the declared range: those
      # are different facts and only the first one ran.
      - name: Install
        run: npm ci

      # The same `tsc --build` the gates job runs before its Test step, so what is repeated below is
      # what has actually been failing rather than a differently-prepared tree.
      - name: Build
        run: npm run build

      # Reports the environment, then loops. One step rather than two: the runner prints the
      # environment before run 1, so it is in the log even if the loop is later cut short.
      - name: Probe
        run: npm run probe:flake
