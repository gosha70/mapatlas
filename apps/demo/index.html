<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAP-ATLAS field logger</title>
    <!-- Leaflet CSS. A production consumer should self-host this asset. -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      /* Field logger: clicking the map drops an event → crosshair affordance. */
      .leaflet-container { cursor: crosshair; }
      .leaflet-container.leaflet-dragging,
      .leaflet-dragging .leaflet-container { cursor: grabbing; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
