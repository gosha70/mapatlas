# SPDX-License-Identifier: Apache-2.0
#
# T8.1 — the fixture-build flake (issue #30), increment 2e.
#
# **Manual only.** `workflow_dispatch` is the sole trigger, deliberately: this exists to read a
# runner's environment, and a job that also fired on push or pull request would add CI cost to
# every change and become a source of runs nobody is reading — which is the habit issue #30 already
# warns about.
#
# **It runs a two-arm comparison.** Positional narrowing closed at `c20b417`, so the question is no
# longer *where* the change happens but whether it depends on one property of the runtime. 2c ran
# default Node against `--jitless` from this workflow (run 35512357623: 8/60 against 0/60,
# p = 0.00609). **It now runs 2e: default against `--no-opt`** — TurboFan disabled, Maglev and
# Sparkplug left running — alternating, **150 runs per arm**. 2d ran the same cut at 60 per arm
# and its control returned 0/60, which said nothing about the variant.
#
# **2e is a follow-on, not 2d at a larger budget.** Two things differ: the budget, and the suite.
# 2c and 2d measured 95 files while probing; T8.2 then added one and T8.3 removed five, so this
# job measures **91**. The suite is the workload whose flakiness is being measured, so 2e is read
# on its own terms — the 95-file evidence, `M = 61` included, stays scoped to that suite. The
# count this job actually collects is printed by `check:runtime-mode` in the step below, which is
# where a reader should take it from rather than from this comment. Both arms
# spawn the identical `npm run test:coverage`; the difference travels as an environment marker
# that `vitest.config.ts` turns into the test workers' `execArgv`, so only the workers running the
# suite are in the other mode and Vite's parent starts normally. `npm run check:runtime-mode` — a
# required step of `ci.yml`, and part of `npm run verify` — proves that transport, and what
# `--no-opt` means on the Node it runs with, using real subprocesses. **This job runs it too,
# before the loop**, because the Node a dispatch resolves is the one the result is about.
#
# 2e is the **third** separately predeclared **exploratory** diagnostic at `α = 0.05`, after 2c and
# 2d. 2c spent the only α the plan had granted, so the family carries no 5% family-wise guarantee:
# at most 15% across the three, by the union bound.
#
# There is deliberately **no run-count input**: a budget chosen at dispatch time is a probabilistic
# bar selected after the result is known. 150 per arm is the budget increment 2e predeclared — not
# a minimum for any bar, but a fixed budget at which a **null control is itself a finding** (its
# one-sided 95% upper bound is 1.977%), which is what 2d's null could not be. Changing it means
# editing `scripts/flake-experiment.mjs` under review.
#
# It reports the environment first, keeps going after a hit so the outcome is a pair of **rates**,
# counts each arm separately with the run index of every hit, and prints the full output —
# including the placement report from PR #48 — for each. An unrelated failure or an instrument
# fault in *either* arm makes the whole experiment inconclusive, and a control arm that does not
# reproduce says nothing about the variant however the variant came out. A job that times out kills
# the run before any verdict is printed, which is what stops one being claimed.
#
# **Remove it, or record why it is kept, when T8.1 closes.** A probe left behind after the thing it
# probes is understood is a workflow nobody can explain.
name: T8.1 flake probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: 150 default + 150 --no-opt runs, alternating
    runs-on: ubuntu-latest
    # Raised from 150 for increment 2e's larger budget, which is the only workflow change it makes.
    # Measured: a default run took 18.6 s in 2c's job and 11.9 s in 2d's, on the same image — so
    # 150 + 150 runs is roughly 60 minutes at 2d's pace and 95 at 2c's, and this job's
    # suite is smaller than either. 180 leaves
    # headroom over the slower of the two rather than over their average, deliberately: a timeout
    # kills the job before any verdict is printed, and an experiment whose control arm was cut
    # short is contaminated and answers nothing. That is a worse outcome than a job that idles.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      # The same setup as the `gates` job, so the runtime read here is the runtime that has failed
      # four times rather than whatever this workflow happened to resolve.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `npm ci` because the report names the **installed** Vitest, not the declared range: those
      # are different facts and only the first one ran.
      - name: Install
        run: npm ci

      # The same `tsc --build` the gates job runs before its Test step, so what is repeated below is
      # what has actually been failing rather than a differently-prepared tree.
      - name: Build
        run: npm run build

      # **Certifies the instrument on the runtime that is about to be measured**, in this job's own
      # log. `node-version: 24` floats, so the Node this job resolves need not be the one `ci.yml`
      # last ran this check on — and the per-run certificates inside the loop prove only that
      # `--no-opt` was *delivered* to a worker, not that it disables TurboFan on this binary. A
      # result that says "TurboFan-enabled against TurboFan-disabled" has to have established that
      # here. It also re-reads, on this runner, the workers' exact argument lists and the two arms'
      # collected files. Its own step, **before the loop and outside the measured command**: it
      # spawns nested Vitest runs, and if it fails the job stops with no result rather than with
      # one that means less than it says.
      - name: Certify the instrument on this runtime
        run: npm run check:runtime-mode

      # Reports the environment, then loops. One step rather than two: the runner prints the
      # environment before run 1, so it is in the log even if the loop is later cut short.
      - name: Probe
        run: npm run probe:flake
