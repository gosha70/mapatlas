# SPDX-License-Identifier: Apache-2.0
#
# T8.1 — the fixture-build flake (issue #30), increment 2.0.
#
# **Manual only.** `workflow_dispatch` is the sole trigger, deliberately: this exists to read a
# runner's environment, and a job that also fired on push or pull request would add CI cost to
# every change and become a source of runs nobody is reading — which is the habit issue #30 already
# warns about.
#
# **Step 2a came back null, so this now runs the loop** (200 local runs under the matched runtime
# and worker count, no hits, bounding the local rate at 1.487%). It runs the full suite **exactly
# 100 times**, the budget the plan fixed before any of this was attempted — there is deliberately
# **no run-count input**, because a budget chosen at dispatch time is a probabilistic bar selected
# after the result is known. Changing it means editing `scripts/flake-probe.mjs` under review.
#
# It reports the environment first, keeps going after a hit so the outcome is a **rate** rather than
# an occurrence, counts exact-signature hits and unrelated failures separately, and prints the full
# output — including the placement report added in PR #48 — for every one of either. A job that
# times out, or a run that fails for an unrelated reason, **cannot** produce a clean-null claim.
#
# **Remove it, or record why it is kept, when T8.1 closes.** A probe left behind after the thing it
# probes is understood is a workflow nobody can explain.
name: T8.1 flake probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: 100 full-suite runs, looking for the exact signature
    runs-on: ubuntu-latest
    # 100 runs at roughly 40 s each is a little over an hour; the ceiling is generous so that a
    # slow runner reports a result rather than a timeout — and a timeout, if it happens, kills the
    # job before any verdict is printed, which is what stops one being claimed.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      # The same setup as the `gates` job, so the runtime read here is the runtime that has failed
      # four times rather than whatever this workflow happened to resolve.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `npm ci` because the report names the **installed** Vitest, not the declared range: those
      # are different facts and only the first one ran.
      - name: Install
        run: npm ci

      # The same `tsc --build` the gates job runs before its Test step, so what is repeated below is
      # what has actually been failing rather than a differently-prepared tree.
      - name: Build
        run: npm run build

      # Reports the environment, then loops. One step rather than two: the runner prints the
      # environment before run 1, so it is in the log even if the loop is later cut short.
      - name: Probe
        run: npm run probe:flake
