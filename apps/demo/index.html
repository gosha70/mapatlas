<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MAP-ATLAS demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #app {
        height: 100%;
      }
      #map {
        position: absolute;
        inset: 0;
      }
      /* The root route only. Every selector below is under `body[data-route="root"]`, which
         `/lab` never sets, so the map route keeps its full-bleed layout untouched. */
      body[data-route="root"] {
        font:
          16px/1.5 system-ui,
          sans-serif;
        /* A foreground colour without a background is only half a declaration. The page never
           claimed a colour scheme, so under forced-dark, a user stylesheet, or Chromium's auto
           dark, this fixed near-black landed on whatever canvas the agent painted — measured as
           dark-on-dark, with the headings and step titles effectively invisible. `color-scheme`
           tells the agent this page is light so it stops substituting; `background` is what
           makes that true rather than a request. */
        color-scheme: light;
        background: #fff;
        color: #1f2328;
        padding: 2rem 1.5rem;
        box-sizing: border-box;
        height: auto;
      }
      body[data-route="root"] #app {
        /* A bounded measure: prose set to the full width of a desktop window is hard to read,
           and this control is mostly prose. */
        max-width: 42rem;
        margin: 0 auto;
        height: auto;
      }
      body[data-route="root"] #persistence {
        display: grid;
        gap: 0.5rem;
        justify-items: start;
        margin-top: 1.5rem;
        padding: 1rem 1.25rem;
        border: 1px solid #d0d7de;
        border-radius: 6px;
      }
      body[data-route="root"] #persistence p {
        margin: 0;
      }
      body[data-route="root"] .persistence-headline {
        font-weight: 600;
      }
      body[data-route="root"] .persistence-detail {
        color: #57606a;
      }
      body[data-route="root"] #persistence-request {
        font: inherit;
        padding: 0.45rem 0.9rem;
        border: 1px solid #0969da;
        border-radius: 6px;
        background: #0969da;
        color: #fff;
        cursor: pointer;
      }
      /* `:focus-visible`, so the ring appears for keyboard users without following every mouse
         click. The engine's accessibility guardrail asks for visible focus, and the browser
         default outline is removed by the background above — restoring it is not optional. */
      body[data-route="root"] #persistence-request:focus-visible {
        outline: 2px solid #0969da;
        outline-offset: 2px;
      }
      body[data-route="root"] #persistence-request[disabled] {
        opacity: 0.6;
        cursor: default;
      }
      body[data-route="root"] .app-title {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
      }
      body[data-route="root"] .app-status {
        margin: 0 0 1rem;
        color: #57606a;
      }
      /* The map needs a sized container: `MapCanvas` renders at height 100%, so without a height
         here the element collapses and the projection never settles — which reads in a test as a
         map that drew nothing. The same rule `/lab`'s harness needed. */
      body[data-route="root"] .app-map {
        height: 22rem;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        overflow: hidden;
      }
      body[data-route="root"] .app-lab {
        margin-top: 1.5rem;
        color: #57606a;
      }
      body[data-route="root"] #install-guidance {
        margin-top: 1.5rem;
        padding: 1rem 1.25rem;
        border: 1px solid #d0d7de;
        border-radius: 6px;
      }
      body[data-route="root"] #install-guidance h2 {
        margin: 0 0 0.5rem;
        font-size: 1rem;
      }
      body[data-route="root"] #install-guidance ol {
        margin: 0;
        padding-left: 1.25rem;
        display: grid;
        gap: 0.75rem;
      }
      body[data-route="root"] #install-guidance p {
        margin: 0.25rem 0 0;
        color: #57606a;
      }
      #status {
        position: absolute;
        z-index: 1;
        margin: 0.5rem;
        padding: 0.4rem 0.6rem;
        font:
          13px/1.4 system-ui,
          sans-serif;
        background: rgba(255, 255, 255, 0.85);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
