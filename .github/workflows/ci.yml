# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: build · typecheck · lint · test · scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test:coverage

      - name: Scan — import isolation
        run: npm run scan:isolation

      - name: Scan — SPDX headers
        run: npm run scan:spdx

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The PR head itself, not the synthetic merge commit actions/checkout
          # resolves by default — GitHub generates that one without a sign-off,
          # so checking it fails every PR regardless of the author's commits.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Every commit is signed off
        run: |
          missing=0
          for sha in $(git rev-list --no-merges origin/${{ github.base_ref }}..HEAD); do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>'; then
              echo "::error::commit $sha has no DCO sign-off (use git commit -s)"
              missing=1
            fi
          done
          exit $missing
